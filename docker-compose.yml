services:
  guest-manager:
    image: ghcr.io/le0nwolf/guest-manager:latest
    container_name: guest-manager
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/src/data
    environment:
      - NODE_ENV=production
      - TZ=Europe/Berlin
      - PORT=3000
      # Telegram Bot (optional) - get token from @BotFather
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      # Comma-separated chat IDs (optional, leave empty for no restrictions)
      - TELEGRAM_AUTHORIZED_USERS=${TELEGRAM_AUTHORIZED_USERS:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
